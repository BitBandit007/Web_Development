<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore basic CSS</title>
    <style>
        #short{
            color: crimson;
            text-align: center;
        }
        p{
            background-color: rgb(240, 230, 140);
            width:50%;
        }
        #embedded
        {
            font-size: larger;
            font-weight: bolder;
        }
        li{
            color: indianred;
            
        }
        .player{
            text-align: right;
        }
    </style>
</head>
<body>
    <h3 style="color: blueviolet;">Learning Basic CSS</h3>
    <h4 style="background-color: aquamarine;">Inline CSS</h4>
    <p>CSS meaning Cascading Style Sheet</p>
    <p>Style is colorful</p>
    <p id="short">Short form is CSS</p>
    <p class="player">Needs style rule and value separated by colon(:) </p>
    <p class="player">After each style you need to put a semicolon(;)</p>
    <ul>
        <li>Inline</li>
        <li id="embedded">Internal or embeded</li>
        <li>External</li>
    </ul>
    
</body>
</html>
